! frr-pe2: AS 65000, router-id 10.0.0.3
!   peers RustyBGP (10.0.0.1) as iBGP / RR client
!   originates 198.51.100.0/24 (TEST-NET-2) and 2001:db8:beef::/48
!   also re-originates 192.0.2.0/24 with a community so we can see
!   multi-path resolution in the looking glass UI.
hostname pe2
!
ip prefix-list ANNOUNCE-V4 seq 10 permit 198.51.100.0/24
ip prefix-list ANNOUNCE-V4 seq 20 permit 192.0.2.0/24
ipv6 prefix-list ANNOUNCE-V6 seq 10 permit 2001:db8:beef::/48
!
route-map ANNOUNCE-V4 permit 10
 match ip address prefix-list ANNOUNCE-V4
 set community 65000:200
exit
route-map ANNOUNCE-V6 permit 10
 match ipv6 address prefix-list ANNOUNCE-V6
 set community 65000:200
exit
!
router bgp 65000
 bgp router-id 10.0.0.3
 no bgp ebgp-requires-policy
 neighbor 172.30.10.1 remote-as 65000
 neighbor 172.30.10.1 description rustybgp-rr
 neighbor 172.30.10.1 update-source 172.30.10.3
 neighbor 172.30.10.1 send-community
 !
 address-family ipv4 unicast
  network 198.51.100.0/24
  network 192.0.2.0/24
  neighbor 172.30.10.1 activate
  neighbor 172.30.10.1 route-map ANNOUNCE-V4 out
 exit-address-family
 !
 address-family ipv6 unicast
  network 2001:db8:beef::/48
  neighbor 172.30.10.1 activate
  neighbor 172.30.10.1 route-map ANNOUNCE-V6 out
 exit-address-family
exit
!
ip route 198.51.100.0/24 Null0
ip route 192.0.2.0/24 Null0
ipv6 route 2001:db8:beef::/48 Null0
!
end
