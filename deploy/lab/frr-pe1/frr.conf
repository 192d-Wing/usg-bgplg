! frr-pe1: AS 65000, router-id 10.0.0.2
!   peers RustyBGP (10.0.0.1) as iBGP / RR client
!   originates 192.0.2.0/24 (TEST-NET-1) and 2001:db8:cafe::/48
hostname pe1
!
ip prefix-list ANNOUNCE-V4 seq 10 permit 192.0.2.0/24
ipv6 prefix-list ANNOUNCE-V6 seq 10 permit 2001:db8:cafe::/48
!
route-map ANNOUNCE-V4 permit 10
 match ip address prefix-list ANNOUNCE-V4
exit
route-map ANNOUNCE-V6 permit 10
 match ipv6 address prefix-list ANNOUNCE-V6
exit
!
router bgp 65000
 bgp router-id 10.0.0.2
 no bgp ebgp-requires-policy
 neighbor 172.30.10.1 remote-as 65000
 neighbor 172.30.10.1 description rustybgp-rr
 neighbor 172.30.10.1 update-source 172.30.10.2
 !
 address-family ipv4 unicast
  network 192.0.2.0/24
  neighbor 172.30.10.1 activate
  neighbor 172.30.10.1 route-map ANNOUNCE-V4 out
 exit-address-family
 !
 address-family ipv6 unicast
  network 2001:db8:cafe::/48
  neighbor 172.30.10.1 activate
  neighbor 172.30.10.1 route-map ANNOUNCE-V6 out
 exit-address-family
exit
!
ip route 192.0.2.0/24 Null0
ipv6 route 2001:db8:cafe::/48 Null0
!
end
