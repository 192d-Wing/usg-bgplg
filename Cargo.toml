[workspace]
resolver = "2"
members  = ["crates/bgplg-core", "crates/bgplg-api", "crates/bgplg-rustybgp"]

[workspace.package]
version       = "0.0.1"
edition       = "2021"
rust-version  = "1.80"
license       = "Apache-2.0"
repository    = "https://github.com/192d-Wing/usg-bgplg"
authors       = ["192d Wing <john.willman.1@us.af.mil>"]

[workspace.dependencies]
tokio       = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
axum        = { version = "0.7" }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow      = "1"
thiserror   = "1"
ipnet       = { version = "2", features = ["serde"] }
chrono      = { version = "0.4", features = ["serde"] }
# RustyBGP gRPC client toolchain — versions match upstream RustyBGP at the pinned SHA
# (see crates/bgplg-rustybgp/VENDOR.md).
tonic             = "0.14"
tonic-prost       = "0.14"
tonic-prost-build = "0.14"
prost             = "0.14"
prost-types       = "0.14"
